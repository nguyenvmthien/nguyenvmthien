  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="684" y="78" width="122" height="76" rx="16" fill="#0E1A2D" stroke="#2A405C"/>
    <circle cx="716" cy="111" r="8" fill="#60A5FA"/>
    <text x="735" y="116" fill="#D7E4F3" font-size="15" font-weight="700">PRODUCT</text>
    <text x="704" y="140" fill="#6F86A4" font-size="12">APIs · UX · RAG</text>

    <rect x="824" y="105" width="122" height="76" rx="16" fill="#0E1A2D" stroke="#2A405C"/>
    <circle cx="856" cy="138" r="8" fill="#22D3EE"/>
    <text x="875" y="143" fill="#D7E4F3" font-size="15" font-weight="700">AGENTS</text>
    <text x="844" y="167" fill="#6F86A4" font-size="12">Tools · Loop · Eval</text>

    <rect x="965" y="70" width="150" height="76" rx="16" fill="#0E1A2D" stroke="#2A405C"/>
    <circle cx="997" cy="103" r="8" fill="#A78BFA"/>
    <text x="1016" y="108" fill="#D7E4F3" font-size="15" font-weight="700">LLM SYSTEMS</text>
    <text x="985" y="132" fill="#6F86A4" font-size="12">Routing · Guardrails</text>

    <rect x="756" y="207" width="150" height="76" rx="16" fill="#0E1A2D" stroke="#2A405C"/>
    <circle cx="788" cy="240" r="8" fill="#34D399"/>
    <text x="807" y="245" fill="#D7E4F3" font-size="15" font-weight="700">INFERENCE</text>
    <text x="776" y="269" fill="#6F86A4" font-size="12">vLLM · SGLang · KV</text>

    <rect x="925" y="230" width="164" height="76" rx="16" fill="#0E1A2D" stroke="#2A405C"/>
